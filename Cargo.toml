[workspace]
members = ["gui"]
resolver = "3"

[workspace.package]
version = "0.6.0"
rust-version = "1.95"
edition = "2024"
authors = ["Moritz Baron"]
description = "PLOX - Plugin Load Order eXpert. PLOX is a tool for analyzing and sorting your plugin load order. Supports Morrowind, OpenMW and Cyberpunk"
documentation = ""

[workspace.dependencies]
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
byteorder = "1.5"
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[package]
name = "plox"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true

[dependencies]
clap = { workspace = true }
petgraph = "0.8"
rust-ini = "0.21"
regex = "1.13"
reqwest = { version = "0.13", features = ["blocking"] }
seahash = "4.1"
semver = "1.0"
lenient_semver = "0.4"
pelite = "0.10"
thiserror = "2.0"

byteorder = { workspace = true }
dirs = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
openmw-config = { version = "3.0.2", default-features = false }

[lints]
workspace = true

[dev-dependencies]
pretty_assertions = "1.4"
serde_json = "1.0"
rand = "0.10"
tempfile = "3.27.0"


[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
