[package]
name = "plox_gui"
edition.workspace = true

version.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true

[lints]
workspace = true

[features]
default = ["wgpu"]
# Modern renderer (Vulkan, DX12, Metal). The OpenGL (glow) renderer is always built in.
wgpu = ["eframe/wgpu_no_default_features", "dep:wgpu", "dep:pollster"]

[dependencies]
plox = { path = "../" }

# Emoji fonts for the theme buttons (💻 🌙 ☀), not part of `default_fonts` since 0.37.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",     # Screen reader support.
    "default_fonts", # Embed the default egui fonts.
    "glow",          # OpenGL 2.1+ renderer, works on legacy GPUs.
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # Linux Wayland compositors.
    "x11",           # Linux X11 compositors.
] }
# Same version as eframe uses, only to restrict the compiled backends.
wgpu = { version = "30", default-features = false, optional = true, features = [
    "std",
    "parking_lot",
    "wgsl",
    "vulkan",
    "dx12",
    "metal",
] }
pollster = { version = "1.0", optional = true }

clap = { workspace = true }
dirs = { workspace = true }
log = { workspace = true }
serde = { workspace = true }

open = "5.4"
simplelog = "0.12"
toml = "1.2"
